[versions]
loom = "1.13.+"
githubRelease = "2.4.1"
minotaur = "2.+"
curse = "1.1.+"

kaleidoConfig = "0.3.3+1.3.2"

mc = "1.21.11"
fl = "0.19.3"
yarn = "1.21.11+build.6"
fapi = "0.141.6+1.21.11"

# Upstream Surveyor has no 1.21.11 build: it stops at 1.2.1+1.22 for 1.21.8 and
# resumes at 26.1. This is our own port of that same 1.2.1, built from
# Downloads\Reign\Surveyor and published to mavenLocal.
surveyor = "1.2.1+1.21.11-ra.1"
clothConfig = "21.11.153"

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
githubRelease = { id = "com.github.breadmoirai.github-release", version.ref = "githubRelease" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
curse = { id = "net.darkhax.curseforgegradle", version.ref = "curse" }

[libraries]
kaleidoConfig = { group = "folk.sisby", name = "kaleido-config", version.ref = "kaleidoConfig" }

mc = { group = "mojang", name = "minecraft", version.ref = "mc" }
fl = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fl" }
yarn = { group = "net.fabricmc", name = "yarn", version.ref = "yarn" }
fapi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fapi" }

surveyor = { group = "folk.sisby", name = "surveyor", version.ref = "surveyor" }
clothConfig = { group = "me.shedaniel.cloth", name = "cloth-config-fabric", version.ref = "clothConfig" }
