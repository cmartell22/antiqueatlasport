plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.17.19"
}

repositories {
    maven { url "https://repo.sleeping.town/" }
    maven { url "https://repo.codemc.io/repository/relativitymc/" }
}

dependencies {
    implementation "folk.sisby:kaleido-config:0.3.3+1.3.2"
    minecraft "mojang:minecraft:26.1.2"
    mappings "org.relativitymc:modern-yarn:26.1.2+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
    modImplementation "folk.sisby:surveyor:1.2.4+26.1"
}

sourceSets.main.java {
    srcDirs("../probe-src", "../../../src/main/java")
    include "P4SurveyorCompatibilityProbe.java"
    include "glam/ardor/roleplayers_atlas/mixin/MixinRegionStructureSummary.java"
}

loom {
    useIntermediateMappings = true
    intermediaryUrl = "https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1\$s/intermediary-%1\$s-v2.jar"

    runs {
        p4Probe {
            server()
            runDir = file("../../../build/p4-compat/server-run")
            vmArg "-Dwawi.p4.fixtures=${file("..").absolutePath}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

def probeRunDir = file("../../../build/p4-compat/server-run")
tasks.register("prepareP4ProbeRun") {
    doLast {
        probeRunDir.mkdirs()
        new File(probeRunDir, "eula.txt").text = "eula=true\n"
    }
}

tasks.named("runP4Probe") {
    dependsOn "prepareP4ProbeRun"
}
