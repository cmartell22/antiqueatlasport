//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
	alias libs.plugins.githubRelease
	alias libs.plugins.minotaur
	alias libs.plugins.curse
}

version = "$baseVersion+$branch"
base.archivesName = project.slug

repositories {
	mavenLocal()
	maven { url "https://repo.sleeping.town/" }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	implementation libs.kaleidoConfig

	minecraft libs.mc
	mappings variantOf(libs.yarn) { classifier "v2" }
	modImplementation libs.fl

	modImplementation libs.fapi

	modImplementation libs.surveyor
	include libs.surveyor

	// ModMenu: config screen entrypoint; present in the dev client for testing.
	modCompileOnly "com.terraformersmc:modmenu:15.0.2"
	modLocalRuntime "com.terraformersmc:modmenu:15.0.2"

	// Cloth Config: optional at runtime, so it must not be shaded in. It brings
	// its own copy of Fabric API along, which would fight with ours.
	modCompileOnly(libs.clothConfig) { exclude group: "net.fabricmc.fabric-api" }
	modLocalRuntime(libs.clothConfig) { exclude group: "net.fabricmc.fabric-api" }
}

loom {
	runs {
		client {
			// Dev convenience: jump straight into the test world.
			programArgs "--quickPlaySingleplayer", "New World"
		}
	}
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}. Contributions by ${contributors}",
		mc            : compatibleVersions.split(", ")[0],
		fl            : libs.versions.fl.get(),
		fapi          : libs.versions.fapi.get(),
		surveyor      : libs.versions.surveyor.get(),
	]
	inputs.properties(meta)
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}" }
	}
}

publishing {
	repositories {
		maven {
			name 'SleepingTown'
			url 'https://repo-api.sleeping.town/'
			credentials(PasswordCredentials)
		}
	}

	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

githubRelease {
	token = "$System.env.GITHUB_TOKEN"
	owner = project.user
	repo = slug
	tagName = "v${baseVersion}+${tagBranch}"
	targetCommitish = tagBranch
	releaseAssets = remapJar
	releaseName = "v${baseVersion}"
	allowUploadToExisting = true
	generateReleaseNotes = true
	body = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text
}

modrinth {
	token = "$System.env.MODRINTH_TOKEN"
	projectId = modrinthSlug
	versionNumber = project.version
	uploadFile = remapJar
	gameVersions = compatibleVersions.split(", ").toList()
	loaders = compatibleLoaders.split(", ").toList()
	changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${baseVersion}+${tagBranch}"
	syncBodyFrom = rootProject.file("README.md").text
	dependencies {
		required.version libs.fapi.get().getName(), libs.versions.fapi.get()
		// Surveyor rides inside the jar, so it is embedded rather than required:
		// listing it as required tells people to go and install it separately,
		// which they neither need to do nor can do wrongly.
		embedded.version libs.surveyor.get().getName(), libs.versions.surveyor.get()
		optional.project "cloth-config"
		optional.project "modmenu"
	}
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	apiToken = "$System.env.CURSEFORGE_TOKEN"
	disableVersionDetection()
	// Inherited from upstream this was their project id, and running the task
	// would have tried to upload this fork onto someone else's page. It now
	// refuses to run until a project of one's own is named in gradle.properties.
	def projectId = project.findProperty("curseforgeId") ?: ""
	if (!projectId) throw new GradleException("Set curseforgeId in gradle.properties before publishing to CurseForge.")
	def mainFile = upload(projectId, remapJar)
	compatibleLoaders.split(", ").toList().forEach { mainFile.addModLoader(it) }
	compatibleVersions.split(", ").toList().forEach { mainFile.addGameVersion(it) }
	mainFile.addEnvironment("client")
	mainFile.addRequirement(libs.fapi.get().getName())
	mainFile.addEmbedded("surveyor-map-framework")
	mainFile.addOptional("cloth-config")
	mainFile.addOptional("modmenu")
	mainFile.changelog = !file("CHANGELOG.md").exists() ? "" : rootProject.file("CHANGELOG.md").text + "\n\nChangelog: https://github.com/${user}/${slug}/releases/tag/v${baseVersion}+${tagBranch}"
	mainFile.changelogType = "markdown"
	mainFile.releaseType = "release"
}

tasks.register("fullRelease") {
	group "publishing"
	dependsOn "githubRelease"
	dependsOn "publish"
	dependsOn "modrinth"
	dependsOn "curseforge"
}


