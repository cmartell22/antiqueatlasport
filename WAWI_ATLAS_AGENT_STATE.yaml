  - id: "INV-003"
    rule: "Porting commits remain easy to diff: no unrelated refactors, renames, formatting, art, or WAWI feature work."
  - id: "INV-004"
    rule: "Discovered terrain and structures are recorded; unexplored structures are not predicted or exposed."
  - id: "INV-005"
    rule: "Atlas cartography remains deliberately abstract and tile-based, never a precise live overhead map."
  - id: "INV-006"
    rule: "Existing player map and annotation data must not be silently lost, reset, cross-contaminated, or corrupted."
  - id: "INV-007"
    rule: "Every serialization or .atlas-format change requires compatibility fixtures, round-trip tests, and an explicit decision."
  - id: "INV-008"
    rule: "Client-only Atlas code must not cause dedicated-server classloading, mixin, or startup failures."
  - id: "INV-009"
    rule: "Multiplayer synchronization and visibility remain owned and validated through current Surveyor behavior."
  - id: "INV-010"
    rule: "Overworld, Nether, End, reconnect, restart, resource reload, and GUI-scale behavior are release gates."
  - id: "INV-011"
    rule: "WAWI-specific progression, biome mappings, presentation, and mechanics begin only after the compatibility gate and stay isolated."
  - id: "INV-012"
    rule: "Code and assets retain all applicable licenses, notices, attribution, and copied-code provenance."
  - id: "INV-013"
