design_authority:
  file: "design-doc.txt"
  sha256: "1FC133AE82AECD1CA5728B80015C66A4D32A0C1C30F107EE73EC990520B24079"
  status: "LOCKED_INPUT"
  north_star: >-
    The atlas should make the world more memorable, not make navigation irrelevant: a player
    should recognize explored valleys, rivers, forests, mountains, and marked settlements from a
    hand-drawn record, then return to navigating primarily through the world itself.
  phase_1_principle: "Faithful and technically conservative AA4 compatibility port first."
  backend_principle: "Adapt AA4/Roleplayer's Atlas to current Surveyor; do not recreate or fork the mapping backend."
  abstraction_principle: "Preserve tile-based antique cartography and discovered knowledge, not a live high-resolution GPS."

success_definition:
  compatibility_milestone:
    - "Builds and launches cleanly on Fabric 26.1.2 with Java 25."
    - "Integrates with the pinned current Surveyor Framework without an unnecessary Surveyor fork."
    - "Exploration is recorded and persists correctly."
    - "Terrain, biome, structure, marker, territory, route, text, and atlas UI behavior remain faithful."
    - "Open/close, two-stage held/fullscreen behavior, pan, zoom, input, and resource reload are reliable."
    - "Overworld, Nether, End, reconnect, restart, and multiplayer behavior meet the gated matrix."
    - "No reliance on obsolete mappings or 1.21.11 APIs remains in the target build."
    - "No major dedicated-server or multiplayer regression is inherited or introduced."
    - "A clean checkout can build from documented prerequisites and locked inputs."
  later_wawi_milestone:
    - "Atlas access/item progression, coordinate presentation, markers, and recipes fit WAWI's design."
    - "WWOO, Tectonic, destination biomes, and other WAWI geography receive data-driven mappings where practical."
    - "WAWI additions remain isolated from the faithful-port commit sequence."

non_goals_until_compatibility_release_candidate:
  - "Custom WAWI art or atlas tiles."
  - "Crafting progression or a redesigned atlas item system."
  - "Redesigned marker UI, route planning, minimap, cave map, overlays, or map sharing."
  - "Biome color overhaul or hard-coded WAWI biome lists."
  - "GPS-like HUD guidance or automatic undiscovered structure location."
  - "Unrelated Surveyor changes or a new mapping/storage engine."
  - "Gratuitous package moves, renames, formatting passes, or refactors during the compatibility uplift."

