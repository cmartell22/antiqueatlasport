    rule: "Surveyor remains the authoritative map-data backend; Atlas must not grow a replacement backend."
  - id: "INV-002"
    rule: "The faithful port preserves observable AA4/Roleplayer's Atlas behavior unless a version API makes it impossible."
  - id: "INV-003"
    rule: "Porting commits remain easy to diff: no unrelated refactors, renames, formatting, art, or WAWI feature work."
  - id: "INV-004"
    rule: "Discovered terrain and structures are recorded; unexplored structures are not predicted or exposed."
  - id: "INV-005"
    rule: "Atlas cartography remains deliberately abstract and tile-based, never a precise live overhead map."
  - id: "INV-006"
    rule: "Existing player map and annotation data must not be silently lost, reset, cross-contaminated, or corrupted."
  - id: "INV-007"
    rule: "Every serialization or .atlas-format change requires compatibility fixtures, round-trip tests, and an explicit decision."
  - id: "INV-008"
    rule: "Client-only Atlas code must not cause dedicated-server classloading, mixin, or startup failures."
  - id: "INV-009"
    rule: "Multiplayer synchronization and visibility remain owned and validated through current Surveyor behavior."
  - id: "INV-010"
    rule: "Overworld, Nether, End, reconnect, restart, resource reload, and GUI-scale behavior are release gates."
  - id: "INV-011"
    rule: "WAWI-specific progression, biome mappings, presentation, and mechanics begin only after the compatibility gate and stay isolated."
  - id: "INV-012"
    rule: "Code and assets retain all applicable licenses, notices, attribution, and copied-code provenance."
  - id: "INV-013"
    rule: "No phase completion, version lock, or API claim is accepted without exact evidence recorded here."
  - id: "INV-014"
    rule: "No external push, release, upload, or publication occurs without separate explicit human approval."

test_strategy:
  severity:
    S0: "Cosmetic only; does not impair use or obscure required information."
    S1: "Minor usability defect with safe workaround and no data/persistence impact."
    S2: "Major feature failure, crash, severe visual/input defect, or compatibility regression."
    S3: "Data loss/corruption, cross-player leak, security issue, reproducible server failure, or unrecoverable world/map damage."
  gate_policy:
    - "Any S3 blocks immediately and requires root-cause evidence before further feature work."
    - "Any unexplained S2 blocks the current phase."
    - "Every fixed bug receives the smallest practical automated regression plus the original manual reproduction."
    - "A clean build is necessary but never sufficient for a runtime phase gate."
  automated_layers:
    - "Gradle clean build and all available unit/integration tests."
    - "Static audits for forbidden APIs, stale mappings, mixin targets, client/common boundaries, and resource validity."
    - "Serialization fixtures and round trips for persisted Atlas and Surveyor-facing data."
    - "Artifact audit for metadata, nested dependencies, licenses, resources, and absence of test/diagnostic code."
  runtime_layers:
    - "Development client startup and integrated singleplayer smoke."
    - "Loopback dedicated-server startup/stop and client connection smoke where the phase requires it."
    - "Explicit human-observed feature matrix for rendering, input, interaction, and visual acceptance."
    - "Restart/rejoin, cross-dimension, resource-reload, GUI-scale, and multiplayer isolation checks."
  baseline_manual_matrix:
    - "M key: closed -> handheld -> fullscreen -> closed; ordinary movement/look remains correct."
    - "Fullscreen pan, scroll zoom, resize, GUI scale, pause/resume, and F3+T resource reload."
    - "New exploration populates antique terrain/biome tiles and persists across save/reload."
    - "Markers/layers, death/spawn marks, inscriptions, territories/city paint, and routes."
    - "PNG export plus .atlas export/import/signature/hearsay behavior without source data mutation."
    - "Overworld, Nether, End, portal transition, disconnect/reconnect, and client restart."
    - "Dedicated multiplayer connection, independent player knowledge, and clean server restart."

