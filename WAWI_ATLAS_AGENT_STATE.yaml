known_risks:
  - id: "RISK-001"
    severity: "S2"
    status: "OPEN"
    risk: "The source has no automated test suite; baseline behavior could regress despite successful compilation."
    mitigation: "Capture manual control behavior, then add focused tests/fixtures before or with risky target changes."
  - id: "RISK-002"
    severity: "S2"
    status: "OPEN"
    risk: "The untouched build depends on a private/local legacy Surveyor Maven artifact."
    mitigation: "Rebuild the exact pinned source, hash the artifact, and document reproduction; do not silently substitute versions."
  - id: "RISK-003"
    severity: "S3"
    status: "OPEN"
    risk: "Surveyor storage/component/packet or .atlas serialization changes may corrupt or strand existing map data."
    mitigation: "Freeze fixtures before migration; require old-read/new-round-trip and failure-path tests before acceptance."
  - id: "RISK-004"
    severity: "S2"
    status: "OPEN"
    risk: "Minecraft 26.1 render/input/resource APIs and mixin targets are version-sensitive and visually test-heavy."
    mitigation: "Use exact target source, small categorized commits, structural audits, and human visual checkpoints."
  - id: "RISK-005"
    severity: "S2"
    status: "OPEN"
    risk: "Client-only implementation or embedded Surveyor may still produce dedicated-server classloading regressions."
    mitigation: "Run dedicated-server smoke gates at build migration, integration, hardening, and release-candidate phases."
  - id: "RISK-006"
    severity: "S1"
    status: "OPEN"
    risk: "Windows path length and large generated Minecraft paths may break Gradle/Loom operations."
    mitigation: "core.longpaths is enabled and disposable dependency worktrees must use short absolute paths."
  - id: "RISK-007"
    severity: "S2"
    status: "OPEN_BASELINE_DEFECT"
    risk: "The untouched Atlas release jar omits CREDITS, and the reconstructed Surveyor jar contains its license under an inherited malformed filename."
    mitigation: "Preserve repository notices now; correct and audit release packaging in an approved build/release phase before distribution."
  - id: "RISK-008"
    severity: "S1"
    status: "OPEN_BASELINE_WARNING"
    risk: "Client startup warns that optional punchy/config/PunchyConfig is absent."
    mitigation: "Confirm the optional Mixin fails soft by design during P1 archaeology and retain a startup regression check."
  - id: "RISK-009"
    severity: "S1"
    status: "OPEN_HARNESS_LIMITATION"
    risk: "The source quick-play convenience did not auto-enter the copied world, and Minecraft 1.21.11 ignores legacy server/port startup flags."
    mitigation: "Use the ignored Loom run-config override plus explicit human UI navigation; do not alter production build behavior during P0."
  - id: "RISK-010"
    severity: "S2"
    status: "MITIGATED_AND_VERIFIED_5X"
    risk: "An untouched-baseline repeat integrated join threw ConcurrentModificationException in WorldAtlasData.WORLDS.computeIfAbsent and disconnected the client with Network Protocol Error."
    mitigation: "WORLDS now uses ConcurrentHashMap; clean build, five fresh-JVM join/save/exit repetitions, bytecode/null-key audits, and a dedicated-server regression all passed. Retain repeat-join coverage in later runtime gates."
  - id: "RISK-011"
    severity: "S1"
    status: "CLOSED_EXTERNAL_REMOTE_SESSION"
    risk: "One isolated integrated-client manual-matrix attempt exhibited uncontrolled rapid camera rotation without a logged crash or exception, invalidating that attempt's human observations."
    mitigation: "The owner reproduced the distinction and confirmed controls are normal at the physical PC; the problem was the remote-control session. Raw input is restored, no Atlas change was made, and human UI testing will be performed physically."
  - id: "RISK-012"
    severity: "S1"
    status: "MITIGATED_AND_HUMAN_VERIFIED"
    risk: "At Auto GUI scale in the measured 1073x663 client window, the fixed-height marker modal runs below the screen and makes controls below the note field inaccessible."
    mitigation: "MarkerModal now recenters its complete content and contracts only the note area when needed. Geometry checks cover logical heights 240-480; clean build passed; the owner completed the exact workflow at Auto scale in an even smaller 870x519 window and confirmed the roomy note returns at scale 1."

