  major_areas:
    - "Surveyor-backed exploration summaries, landmarks, region structures, and client persistence."
    - "Atlas held renderer, fullscreen screen, tile renderer, batched GUI drawing, pan/zoom/input."
    - "Data-driven biome, terrain, structure, marker, and texture reloaders."
    - "Markers, layers, territories/city paint, routes, inscriptions, dates, spawn/death marks."
    - "Local atlas state, corrections, tracking, autosave, PNG export, and .atlas share/import."
    - "Optional Cloth Config and Mod Menu integration."
  backend_boundary: >-
    Surveyor owns exploration/map summaries, landmarks, synchronization, and backend persistence.
