decisions:
  - id: "DEC-001"
    date: "2026-08-26"
    decision: "Start from the known-working Roleplayer's Atlas 1.21.11 base, then perform one controlled uplift to 26.1.2."
    source: "Human project owner"
    rationale: "Preserves a functioning control and avoids repeatedly reinventing already-working AA4 behavior."
  - id: "DEC-002"
    date: "2026-08-26"
    decision: "Use this YAML as durable project authority; volatile chat is not the context source of truth."
    source: "Human project owner"
  - id: "DEC-003"
    date: "2026-08-26"
    decision: "Reuse compatible JavaBackport SDK/caches/launch prerequisites, but maintain a clean 1.21.11 runtime boundary."
    source: "Human project owner plus P0 implementation safety boundary"
  - id: "DEC-004"
    date: "2026-08-27"
    decision: "Use Modern Yarn 26.1.2+build.4 only as an immutable P1 research mapping; choose and lock the production mapping/toolchain in P2."
    source: "P1 source archaeology"
    rationale: "Exact API evidence is needed now, while dependency selection remains a separately reviewable build-system decision."
  - id: "DEC-005"
    date: "2026-08-27"
    decision: "Lock the target to Modern Yarn 26.1.2+build.4 with Loom remap 1.17.19 and exact RelativityMC intermediary mappings."
    source: "P2 build-system verification"
    rationale: "This aligns Atlas with current Surveyor's mapping convention while pinning the exact target release and eliminating dynamic resolution."
  - id: "DEC-006"
    date: "2026-08-27"
    decision: "Consume official Surveyor 1.2.4+26.1, pinned by hash, after proving its exact source commit builds unchanged against the 26.1.2 target stack."
    source: "P2 dependency and source-build verification"
    rationale: "The official artifact declares Minecraft >=26.1 and avoids an unreproducible mavenLocal dependency; P4 still owns runtime/data compatibility."
  - id: "DEC-007"
    date: "2026-08-27"
    decision: "Use Cloth Config 26.1.154 and Mod Menu 18.0.0 as optional target integrations; retain Kaleido Config 0.3.3+1.3.2."
    source: "P2 artifact metadata inspection"
    rationale: "Their declared Minecraft ranges match 26.1.2, while newer Mod Menu 20 explicitly targets 26.2."
  - id: "DEC-008"
    date: "2026-08-27"
    decision: "Make no P4 production edit because exact target source and the runtime fixture probe demonstrate compatibility at every currently reachable Surveyor integration surface."
    source: "P4 exact-source comparison and frozen-fixture runtime probe"
    rationale: "The one known jigsaw persistence defect remains covered by Atlas's pre-existing mixin; inventing an additional shim or forking Surveyor would increase risk without repairing a demonstrated failure."
  - id: "DEC-009"
    date: "2026-08-27"
    decision: "Do not silently override current Surveyor's globalSharing operator configuration from Atlas; faithful isolation tests and deployments explicitly select false."
    source: "P4 ownership and synchronization source comparison"
    rationale: "P0 config-preserving upgrades already retain false, while forcing a backend setting would violate operator intent and the Surveyor ownership boundary. The clean-install default difference remains visible for hardening policy."
  - id: "DEC-010"
    date: "2026-08-27"
    decision: "Replace removed RenderLayers.entityNoOutline(texture) with the target-supported RenderLayers.entityTranslucent(texture, false) and require a handheld transparency/depth visual checkpoint."
    source: "P5 exact 1.21.11 bytecode and exact Minecraft 26.1.2 RenderTypes/RenderPipelines source comparison"
    rationale: "The target factory preserves textured lightmapped entity translucency, blending, no-cull behavior, sorting, and disables outlines. No exact non-emissive target factory preserves the legacy depth-write-off pipeline, so inventing a custom pipeline would be a broader and more brittle behavioral rewrite than adopting the supported target analogue with explicit visual acceptance."
  - id: "DEC-011"
    date: "2026-08-27"
    decision: "Retain one renderer-owned BufferAllocator and Immediate provider across frames, flush inside the target custom-geometry phase, and close the native allocator on CLIENT_STOPPING."
    source: "P5 exact BufferAllocator, VertexConsumerProvider, SubmitNodeCollection, CustomFeatureRenderer, and Fabric ClientLifecycleEvents source/bytecode"
    rationale: "Atlas needs multiple texture-specific layers to land at one ordered handheld-render point. Per-frame allocator construction would churn native memory, while never closing the retained allocator would leave ownership implicit; the lifecycle hook makes the existing multi-layer submission model explicit and bounded."
  - id: "DEC-012"
    date: "2026-08-27"
    decision: "Translate the deprecated Fabric v0 resource helper directly to v1 ResourceLoader registration while retaining Minecraft SinglePreparationResourceReloader implementations."
    source: "P6 exact Fabric resource-loader v0/v1 source comparison"
    rationale: "The exact v0 helper is only an adapter that forwards listener IDs and dependency ordering to v1. Direct registration preserves behavior and removes deprecated identity interfaces without changing preparation, apply, resource, or serialization logic."

known_risks:
  - id: "RISK-001"
    severity: "S2"
    status: "OPEN"
    risk: "The source has no automated test suite; baseline behavior could regress despite successful compilation."
    mitigation: "Capture manual control behavior, then add focused tests/fixtures before or with risky target changes."
  - id: "RISK-002"
    severity: "S2"
    status: "CLOSED_FOR_TARGET_LOCK_RETAINED_AS_P0_REPRO_FACT"
    risk: "The untouched build depends on a private/local legacy Surveyor Maven artifact."
    mitigation: "P0 reconstruction remains documented; P2 removed mavenLocal and locks the official current Surveyor artifact by version/hash."
  - id: "RISK-003"
    severity: "S3"
    status: "OPEN"
    risk: "Surveyor storage/component/packet or .atlas serialization changes may corrupt or strand existing map data."
    mitigation: "Freeze fixtures before migration; require old-read/new-round-trip and failure-path tests before acceptance."
  - id: "RISK-004"
    severity: "S2"
    status: "MITIGATED_FOR_P5_PENDING_P6_RESOURCES"
    risk: "Minecraft 26.1 render/input/resource APIs and mixin targets are version-sensitive and visually test-heavy."
    mitigation: "P5 exact-source, compile, mixin-startup, server, and human render/input checkpoints pass. Resource/reloader behavior remains separately owned by P6."
  - id: "RISK-005"
    severity: "S2"
    status: "MITIGATED_AT_P5_RETAINED_FOR_LATER_GATES"
    risk: "Client-only implementation or embedded Surveyor may still produce dedicated-server classloading regressions."
    mitigation: "The exact-lock P5 dedicated server reached Done, loaded all dimensions, and stopped/saved cleanly. Repeat at hardening and release-candidate gates."
  - id: "RISK-006"
    severity: "S1"
    status: "OPEN"
    risk: "Windows path length and large generated Minecraft paths may break Gradle/Loom operations."
    mitigation: "core.longpaths is enabled and disposable dependency worktrees must use short absolute paths."
  - id: "RISK-007"
    severity: "S2"
    status: "OPEN_BASELINE_DEFECT"
    risk: "The untouched Atlas release jar omits CREDITS, and the reconstructed Surveyor jar contains its license under an inherited malformed filename."
    mitigation: "Preserve repository notices now; correct and audit release packaging in an approved build/release phase before distribution."
  - id: "RISK-008"
    severity: "S1"
    status: "MITIGATED_AND_TARGET_RUNTIME_VERIFIED"
    risk: "Client startup warns that optional punchy/config/PunchyConfig is absent."
    mitigation: "P1 confirmed @Pseudo, remap=false, and require=0 fail-soft intent; P5 target startup emitted only the expected warning and continued through world join and normal shutdown."
  - id: "RISK-009"
    severity: "S1"
    status: "OPEN_HARNESS_LIMITATION"
    risk: "The source quick-play convenience did not auto-enter the copied world, and Minecraft 1.21.11 ignores legacy server/port startup flags."
    mitigation: "Use the ignored Loom run-config override plus explicit human UI navigation; do not alter production build behavior during P0."
  - id: "RISK-010"
    severity: "S2"
    status: "MITIGATED_AND_VERIFIED_5X"
    risk: "An untouched-baseline repeat integrated join threw ConcurrentModificationException in WorldAtlasData.WORLDS.computeIfAbsent and disconnected the client with Network Protocol Error."
    mitigation: "WORLDS now uses ConcurrentHashMap; clean build, five fresh-JVM join/save/exit repetitions, bytecode/null-key audits, and a dedicated-server regression all passed. Retain repeat-join coverage in later runtime gates."
  - id: "RISK-011"
    severity: "S1"
    status: "CLOSED_EXTERNAL_REMOTE_SESSION"
    risk: "One isolated integrated-client manual-matrix attempt exhibited uncontrolled rapid camera rotation without a logged crash or exception, invalidating that attempt's human observations."
    mitigation: "The owner reproduced the distinction and confirmed controls are normal at the physical PC; the problem was the remote-control session. Raw input is restored, no Atlas change was made, and human UI testing will be performed physically."
  - id: "RISK-012"
    severity: "S1"
    status: "MITIGATED_AND_HUMAN_VERIFIED"
    risk: "At Auto GUI scale in the measured 1073x663 client window, the fixed-height marker modal runs below the screen and makes controls below the note field inaccessible."
    mitigation: "MarkerModal now recenters its complete content and contracts only the note area when needed. Geometry checks cover logical heights 240-480; clean build passed; the owner completed the exact workflow at Auto scale in an even smaller 870x519 window and confirmed the roomy note returns at scale 1."
  - id: "RISK-013"
    severity: "S2"
    status: "MITIGATED_BY_EXACT_BUILD_AND_TARGET_RUNTIME_FIXTURE_PROOF_PENDING_FULL_ATLAS_RUNTIME"
    risk: "Pinned Surveyor head declares 26.1 compatibility but is not an exact published 26.1.2 lock."
    mitigation: "The exact source pin clean-built against the P2 lock and P4's exact target dedicated-server fixture probe passed all reachable codecs/persistence; repeat full Atlas client/dedicated synchronization after P5 compilation in P7/P8."
  - id: "RISK-014"
    severity: "S2"
    status: "MITIGATED_AND_HUMAN_VERIFIED"
    risk: "Minecraft 26.1.2 removed the held renderer's old ordered submitCustom API and changed the GameRenderer bobView/renderHand descriptors."
    mitigation: "P5 exact-source migration retained target custom geometry, retargeted bobView, passed mixin startup, and passed human handheld/fullscreen ordering, input, bob, resize, scale, and pause checkpoints."
  - id: "RISK-015"
    severity: "S2"
    status: "OPEN"
    risk: "Fabric 26.1.2 has confirmed compile breaks in key mapping, end-level tick, and convention-tag APIs; resource registration is deprecated."
    mitigation: "Apply categorized P3/P6 changes with compile, lifecycle, biome fallback, and F3+T reload regressions."
  - id: "RISK-016"
    severity: "S2"
    status: "MITIGATED_BY_SEPARATE_P2_LOCK_COMMIT"
    risk: "Changing mapping namespace or toolchain while uplifting APIs can hide semantic changes or create an unreviewable mixed diff."
    mitigation: "P2 selected and committed the exact mappings/toolchain with zero production edits; P3 remains separately approval-gated."
  - id: "RISK-017"
    severity: "S1"
    status: "MITIGATED_HOST_HARNESS_ONLY"
    risk: "This Codex host reports Unix-domain socket support but rejects the JDK selector pipe connection, preventing Gradle daemon transport before project configuration."
    mitigation: "Pointing jdk.net.unixdomain.tmpdir at a nonexistent path makes the JDK fall back to TCP loopback; this is an uncommitted execution setting and all proof builds then ran normally."
  - id: "RISK-018"
    severity: "S2"
    status: "MITIGATED_AND_HUMAN_VERIFIED"
    risk: "The target removed DrawBatcher's RenderLayers.entityNoOutline texture factory; choosing a replacement can affect blending, depth, outlines, and map appearance."
    mitigation: "P5 selected target entityTranslucent(texture, false) from exact source; the human owner observed correct handheld transparency, depth/layering, and no black box, flicker, or unwanted outline."
  - id: "RISK-019"
    severity: "S1"
    status: "OPEN_ASSIGNED_TO_P7_P8_POLICY_AND_RUNTIME_MATRIX"
    risk: "Current Surveyor defaults networking.globalSharing to true, while the legacy P0 default was false; a clean server can therefore begin with broader sharing than the independent-knowledge P0 control."
    mitigation: "Config-preserving upgrades retain the explicit P0 false value. Do not override operator configuration in Atlas; document and exercise globalSharing=false in faithful isolation tests, then make the clean-install deployment policy explicit before the release candidate."

